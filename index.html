<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Ben (Michael Jackson by mommy)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      background: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: white;
      font-family: Arial, sans-serif;
    }
    iframe {
      width: 100%;
      max-width: 600px;
      height: 166px;
      border: none;
    }
  </style>
</head>
<body>

  <iframe
    id="sc-player"
    src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/soundcloud%253Atracks%253A2193420447&color=%23ff5500&auto_play=false&visual=true"
    allow="autoplay"
  ></iframe>

  <!-- SoundCloud Widget SDK -->
  <script src="https://w.soundcloud.com/player/api.js"></script>
  <script>
    window.addEventListener('load', () => {
      const iframe = document.getElementById('sc-player');
      const widget = SC.Widget(iframe);

      // Espera o player estar pronto
      widget.bind(SC.Widget.Events.READY, function () {
        console.log("Player pronto. Tentando tocar...");
        widget.play();
      });

      // Tenta tocar novamente caso esteja pausado
      widget.bind(SC.Widget.Events.PAUSE, function () {
        console.log("Player pausou. Tentando tocar de novo...");
        widget.play();
      });
    });
  </script>

</body>
</html>
